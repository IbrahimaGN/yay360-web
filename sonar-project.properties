# Analyse SonarQube Cloud du portail web YAY360 (Angular).
# L'organisation est fournie par la CI (variable GitHub SONAR_ORGANIZATION).
sonar.projectKey=IbrahimaGN_yay360-web
sonar.projectName=YAY360 - Portail web

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/test-setup.ts,**/environments/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/yay360-web/lcov.info

# Détection des duplications : la page d'accueil publique décrit les profils sous forme
# de données (textes statiques), pas de logique répétée.
sonar.cpd.exclusions=src/app/features/public-home/public-home.component.ts

# Scripts de build (assemblage de la PWA) : outillage de déploiement, pas du code applicatif.
sonar.coverage.exclusions=scripts/**
