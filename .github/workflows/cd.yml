# Livraison continue du portail web YAY360 sur Vercel (production).
#
# Déclenchement : uniquement après une exécution RÉUSSIE de « CI web » sur main.
# Validation humaine : environnement GitHub « production » avec validateur obligatoire.
# Le déploiement automatique de Vercel par Git est désactivé (vercel.json) : seule cette CD publie.
# Retour arrière : dans Vercel, « Promote to Production » sur un déploiement précédent (instantané),
# ou lancer ce workflow à la main sur un commit plus ancien.
#
# Secrets (Settings → Environments → production) :
#   VERCEL_TOKEN       jeton personnel Vercel
#   VERCEL_ORG_ID      identifiant du compte ou de l'équipe Vercel
#   VERCEL_PROJECT_ID  identifiant du projet Vercel
# Variable :
#   WEB_URL            URL publique du portail, ex. https://yay360.vercel.app

name: CD web

on:
  workflow_run:
    workflows: ["CI web"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production-web
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'
  # Même version que la CI de yay360-mobile
  FLUTTER_VERSION: '3.47.9'

jobs:
  deployer-production:
    name: Déployer en production (Vercel)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Version de la CLI figée : pas de mise à jour silencieuse de l'outil de déploiement.
      - run: npm install --global --ignore-scripts vercel@64.7.0

      - name: Récupérer la configuration du projet Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # PWA : build web de l'application mobile (dépôt yay360-mobile, branche main), servie sous /app.
      # Elle appelle l'API par le relais /api du portail (même origine, pas de CORS supplémentaire).
      - uses: actions/checkout@v4
        with:
          repository: IbrahimaGN/yay360-mobile
          ref: main
          path: pwa-source

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Construire la PWA
        working-directory: pwa-source
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href /app/ --no-web-resources-cdn --dart-define=API_BASE_URL=/api
          mv build/web ../pwa

      # Build sur le runner GitHub (même commande que la CI), puis envoi du résultat déjà construit.
      - name: Construire
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publier en production
        id: publier
        # Secret transmis par variable d'environnement, jamais développé dans la commande.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Déploiement : $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Tests après déploiement
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL/")
          echo "Page d'accueil : HTTP $code"; test "$code" = "200"
          # Route Angular profonde : doit renvoyer index.html, pas une 404
          code=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL/connexion")
          echo "Route /connexion : HTTP $code"; test "$code" = "200"
          # En-têtes de sécurité présents
          curl -sI "$WEB_URL/" | grep -qi "^content-security-policy:" && echo "CSP présente"
          curl -sI "$WEB_URL/" | grep -qi "^x-frame-options: *DENY" && echo "X-Frame-Options présent"
          # PWA servie sous /app avec son manifeste
          code=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL/app/")
          echo "PWA /app/ : HTTP $code"; test "$code" = "200"
          curl -fsS "$WEB_URL/app/manifest.json" | grep -q '"start_url"' && echo "Manifeste PWA présent"
          # Relais /api vers Render (l'API peut être en veille : jusqu'à 3 minutes de réveil)
          for i in $(seq 1 18); do
            if curl -fsS --max-time 20 "$WEB_URL/api/actuator/health" | grep -q '"UP"'; then
              echo "Relais /api → API : UP"; exit 0
            fi
            echo "API en cours de réveil ($i)…"; sleep 10
          done
          echo "::error::Le relais /api ne joint pas l'API."
          exit 1
