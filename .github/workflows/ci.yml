# Intégration continue du portail web YAY360 (Angular 21, Vitest, Nginx).
# Construit en production, lance les tests et vérifie l'image Docker.
# Aucun déploiement ici : la livraison reste une décision humaine.

name: CI web

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-et-tests:
    name: Build production et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installation reproductible à partir de package-lock.json.
      # --ignore-scripts : aucun script d'installation des dépendances n'est exécuté.
      - run: npm ci --ignore-scripts

      # Échoue si un budget de taille (angular.json) est dépassé.
      - name: Build production
        run: npm run build -- --configuration production

      - name: Tests (Vitest + jsdom)
        run: npm test

      - name: Archive du build
        uses: actions/upload-artifact@v4
        with:
          name: yay360-web-${{ github.sha }}
          path: dist/yay360-web/browser/
          retention-days: 14

  image-docker:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: build-et-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Vérifie que le Dockerfile (build Node puis Nginx) construit ; l'image n'est pas publiée.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: yay360-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  qualite-sonarqube:
    name: Qualité du code (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: build-et-tests
    timeout-minutes: 15
    # Désactivé tant que la variable SONAR_ORGANIZATION n'est pas définie dans le dépôt.
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # Tests avec couverture (rapport lcov lu par SonarQube Cloud).
      - name: Tests et couverture
        run: npm run test:couverture

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
